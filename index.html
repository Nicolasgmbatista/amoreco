<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamirazzo | Artesanal com Alma</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
body { font-family: 'Segoe UI', sans-serif; }

.hero {
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1521334884684-d80222895322?q=80&w=1200') center/cover;
    height: 100vh;
    display: none;
}
.hero.active { display: flex; }

.main-page { display: none; padding-top: 90px; }
.main-page.active { display: block; }

.product-card { transition: 0.3s; }
.product-card:hover { transform: translateY(-8px); }

.active-filter {
    background: #be123c;
    color: white;
}
</style>
</head>

<body class="bg-[#fdf4f0]">

<!-- HEADER -->
<header class="bg-white shadow-md fixed top-0 w-full z-50">
<div class="max-w-7xl mx-auto px-5 py-4 flex justify-between">
<h1 class="text-2xl font-bold text-rose-700">Zamirazzo</h1>

<nav class="flex gap-6 font-medium">
<a href="#" onclick="showPage('inicio')">Início</a>
<a href="#" onclick="showPage('loja')">Loja</a>
<a href="#" onclick="showPage('sobre')">Sobre</a>
<a href="#" onclick="showPage('contato')">Contato</a>
<a href="#" onclick="showPage('admin')" class="text-rose-600">Vendedora</a>
</nav>
</div>
</header>

<!-- HERO -->
<div id="inicio" class="hero active items-center justify-center text-white text-center">
<div>
<h2 class="text-5xl font-bold mb-4">Artesanal.<br>Único.<br>Seu.</h2>
<p class="mb-6">Peças feitas à mão com amor</p>
<button onclick="showPage('loja')" class="bg-rose-600 px-8 py-3 rounded-full">Ver coleção</button>
</div>
</div>

<!-- LOJA -->
<div id="loja" class="main-page">
<div class="max-w-7xl mx-auto p-6">

<h2 class="text-3xl font-bold text-center mb-8">Coleção</h2>

<div class="flex justify-center gap-2 mb-8 flex-wrap">
<button onclick="filterCategory('all')" id="btn-all" class="active-filter px-4 py-2 border rounded-full">Todos</button>
<button onclick="filterCategory('brincos')" id="btn-brincos" class="px-4 py-2 border rounded-full">Brincos</button>
<button onclick="filterCategory('colares')" id="btn-colares" class="px-4 py-2 border rounded-full">Colares</button>
<button onclick="filterCategory('pulseiras')" id="btn-pulseiras" class="px-4 py-2 border rounded-full">Pulseiras</button>
<button onclick="filterCategory('chapeus')" id="btn-chapeus" class="px-4 py-2 border rounded-full">Chapéus</button>
</div>

<div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>

</div>
</div>

<!-- SOBRE -->
<div id="sobre" class="main-page bg-white">
<div class="max-w-4xl mx-auto p-10 text-center">
<h2 class="text-3xl font-bold mb-6">Sobre</h2>
<p>Cada peça é feita artesanalmente com carinho e criatividade.</p>
</div>
</div>

<!-- CONTATO -->
<div id="contato" class="main-page text-center p-16">
<h2 class="text-3xl font-bold mb-4">Contato</h2>
<a href="https://wa.me/5549998109578" target="_blank" class="text-green-600 text-2xl">
<i class="fab fa-whatsapp"></i> WhatsApp
</a>
</div>

<!-- ADMIN -->
<div id="admin" class="main-page p-6">
<h2 class="text-3xl text-center mb-6">Painel</h2>

<input type="password" id="adminPass" placeholder="Senha" class="border p-3 block mx-auto">
<button onclick="loginAdmin()" class="bg-rose-600 text-white px-6 py-2 mt-4 block mx-auto">Entrar</button>

<div id="adminPanel" class="hidden mt-10">
<button onclick="openModal()" class="bg-green-600 text-white px-5 py-3 mb-6">+ Produto</button>
<div id="adminProductsList"></div>
</div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center">
<div class="bg-white p-6 rounded-xl w-96">

<input id="name" placeholder="Nome" class="border p-2 w-full mb-2">
<input id="price" placeholder="Preço" class="border p-2 w-full mb-2">

<select id="category" class="border p-2 w-full mb-2">
<option value="brincos">Brincos</option>
<option value="colares">Colares</option>
<option value="pulseiras">Pulseiras</option>
<option value="chapeus">Chapéus</option>
</select>

<input id="image" placeholder="URL da imagem" class="border p-2 w-full mb-2">

<button onclick="saveProduct()" class="bg-rose-600 text-white w-full py-2">Salvar</button>

</div>
</div>

<script>

// ================= NAV =================
function showPage(id){
document.querySelectorAll('.hero, .main-page').forEach(el=>el.classList.remove('active'));

if(id==='inicio'){
document.getElementById('inicio').classList.add('active');
}else{
document.getElementById(id).classList.add('active');
}
}

// ================= PRODUTOS =================
let products = JSON.parse(localStorage.getItem('products')) || [
{ name:"Brinco Colorido", category:"brincos", price:"R$45", image:"https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb?w=500" }
];

function saveStorage(){
localStorage.setItem('products', JSON.stringify(products));
}

function createCard(p){
const div=document.createElement('div');
div.className="product-card bg-white p-3 rounded-xl";

div.innerHTML=`
<img src="${p.image}" class="h-40 w-full object-cover rounded-lg">
<h3>${p.name}</h3>
<p>${p.price}</p>
<button onclick="buy('${p.name}')" class="bg-rose-600 text-white w-full py-2 mt-2">Comprar</button>
`;

return div;
}

function render(list=products){
const grid=document.getElementById('products-grid');
grid.innerHTML='';
list.forEach(p=>grid.appendChild(createCard(p)));
}

function filterCategory(cat){
document.querySelectorAll('#loja button').forEach(b=>b.classList.remove('active-filter'));
document.getElementById('btn-'+cat).classList.add('active-filter');

const filtered = cat==='all' ? products : products.filter(p=>p.category===cat);
render(filtered);
}

function buy(name){
window.open(`https://wa.me/5549998109578?text=Quero%20${name}`);
}

// ================= ADMIN =================
function loginAdmin(){
if(document.getElementById('adminPass').value==="1234"){
document.getElementById('adminPanel').classList.remove('hidden');
loadAdmin();
}else alert("Senha errada");
}

function loadAdmin(){
const list=document.getElementById('adminProductsList');
list.innerHTML='';

products.forEach((p,i)=>{
const div=document.createElement('div');
div.innerHTML=`
${p.name} - ${p.price}
<button onclick="deleteP(${i})">Excluir</button>
`;
list.appendChild(div);
});
}

function deleteP(i){
products.splice(i,1);
saveStorage();
render();
loadAdmin();
}

function openModal(){
document.getElementById('modal').classList.remove('hidden');
}

function saveProduct(){
const p={
name:document.getElementById('name').value,
price:document.getElementById('price').value,
category:document.getElementById('category').value,
image:document.getElementById('image').value || "https://via.placeholder.com/300"
};

products.push(p);
saveStorage();
render();
loadAdmin();
document.getElementById('modal').classList.add('hidden');
}

// INIT
window.onload=()=>render();

</script>

</body>
</html>

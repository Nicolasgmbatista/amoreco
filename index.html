<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamirazzo | Artesanal com Alma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .hero { background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('img/banner.jpeg') center/cover; height: 100vh; display: none; }
    .hero.active { display: flex; }
    .main-page { display: none; padding-top: 90px; }
    .main-page.active { display: block; }
    .product-card { transition: all 0.4s ease; }
    .product-card:hover { transform: translateY(-10px); }
</style>
</head>
<body class="bg-[#fdf4f0]">

<header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-5 py-5 flex items-center justify-between">
        <h1 class="text-3xl font-bold text-rose-700">Zamirazzo</h1>
        <nav class="flex gap-5 md:gap-10 text-base md:text-lg font-medium">
            <a href="#" onclick="showPage('inicio')" class="hover:text-rose-600">Início</a>
            <a href="#" onclick="showPage('loja')" class="hover:text-rose-600">Loja</a>
            <a href="#" onclick="showPage('sobre')" class="hover:text-rose-600">Sobre</a>
            <a href="#" onclick="showPage('contato')" class="hover:text-rose-600">Contato</a>
            <a href="#" onclick="showPage('admin')" class="text-rose-600 font-bold">Vendedora</a>
        </nav>
    </div>
</header>

<!-- Páginas (mantidas iguais) -->
<div id="inicio" class="hero active items-center text-white">
    <div class="max-w-7xl mx-auto px-6 text-center">
        <h2 class="text-5xl md:text-7xl font-bold mb-6">Artesanal.<br>Único.<br>Seu.</h2>
        <p class="text-xl md:text-3xl mb-10">Brincos, colares, pulseiras e chapéus feitos à mão com miçangas e muito amor.</p>
        <button onclick="showPage('loja')" class="bg-rose-700 hover:bg-rose-800 text-white text-xl px-12 py-5 rounded-full">Ver a Coleção</button>
    </div>
</div>

<div id="loja" class="main-page">
    <div class="max-w-7xl mx-auto px-5 py-12">
        <h2 class="text-4xl md:text-5xl font-bold text-center mb-12 text-rose-800">Nossa Coleção</h2>
        <div class="flex flex-wrap justify-center gap-3 mb-12">
            <button onclick="filterCategory('all')" id="btn-all" class="active-filter px-8 py-3 rounded-full border font-medium">Todos</button>
            <button onclick="filterCategory('brincos')" id="btn-brincos" class="px-8 py-3 rounded-full border font-medium">Brincos</button>
            <button onclick="filterCategory('colares')" id="btn-colares" class="px-8 py-3 rounded-full border font-medium">Colares</button>
            <button onclick="filterCategory('pulseiras')" id="btn-pulseiras" class="px-8 py-3 rounded-full border font-medium">Pulseiras</button>
            <button onclick="filterCategory('chapeus')" id="btn-chapeus" class="px-8 py-3 rounded-full border font-medium">Chapéus</button>
        </div>
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>
</div>

<div id="sobre" class="main-page bg-white"> ... (conteúdo mantido) ... </div>
<div id="contato" class="main-page bg-[#f8e9d8]"> ... (conteúdo mantido) ... </div>

<div id="admin" class="main-page bg-white">
    <div class="max-w-7xl mx-auto px-6 py-10">
        <h2 class="text-4xl font-bold text-center mb-8">👩‍💼 Painel da Vendedora</h2>
        <div id="loginScreen">
            <input type="password" id="adminPass" placeholder="Digite a senha" class="w-full max-w-md mx-auto block p-5 border-2 border-rose-200 rounded-2xl text-center text-lg">
            <button onclick="loginAdmin()" class="mt-6 w-full max-w-md mx-auto block bg-rose-700 text-white py-5 rounded-2xl text-lg font-medium">Entrar</button>
        </div>
        <div id="adminPanel" class="hidden">
            <button onclick="openAddModal()" class="bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-2xl mb-8 w-full">+ Adicionar Novo Produto</button>
            <div id="adminProductsList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>
</div>

<div id="productModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 w-full max-w-lg mx-4">
        <h3 id="modalTitle" class="text-2xl font-bold mb-6">Adicionar Novo Produto</h3>
        <input id="prodName" placeholder="Nome do produto" class="w-full p-4 border rounded-2xl mb-4">
        <input id="prodPrice" placeholder="Preço (ex: R$ 45,00)" class="w-full p-4 border rounded-2xl mb-4">
        <select id="prodCategory" class="w-full p-4 border rounded-2xl mb-4">
            <option value="brincos">Brincos</option>
            <option value="colares">Colares</option>
            <option value="pulseiras">Pulseiras</option>
            <option value="chapeus">Chapéus</option>
        </select>
        <input id="prodImage" placeholder="URL da foto" class="w-full p-4 border rounded-2xl mb-4">
        <textarea id="prodDesc" placeholder="Descrição" class="w-full p-4 border rounded-2xl mb-6 h-28"></textarea>
        
        <div class="flex gap-4">
            <button onclick="closeModal()" class="flex-1 py-4 border rounded-2xl">Cancelar</button>
            <button onclick="saveProduct()" class="flex-1 py-4 bg-rose-700 text-white rounded-2xl">Salvar</button>
        </div>
    </div>
</div>

<script>
// ==================== CONFIGURAÇÃO FIREBASE ====================
const firebaseConfig = {
    apiKey: "SUA_API_KEY_AQUI",                    // ← MUITO IMPORTANTE
    authDomain: "SEU-PROJETO.firebaseapp.com",
    projectId: "SEU-PROJETO",
    storageBucket: "SEU-PROJETO.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:xxxxxxxxxxxxxxxx"
};

// Inicialização com verificação
if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "SUA_API_KEY_AQUI") {
    alert("⚠️ Você ainda não colocou as credenciais do Firebase!");
}

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let products = [];
let editingIndex = -1;

// ==================== FUNÇÕES ====================
async function loadProducts() {
    try {
        const snapshot = await db.collection("produtos").get();
        products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderProducts();
    } catch (e) {
        console.error(e);
        alert("Erro ao carregar produtos. Verifique console (F12)");
    }
}

async function saveProduct() {
    const name = document.getElementById('prodName').value.trim();
    if (!name) return alert("Nome é obrigatório!");

    const product = {
        name: name,
        price: document.getElementById('prodPrice').value || "R$ 0,00",
        category: document.getElementById('prodCategory').value,
        image: document.getElementById('prodImage').value || "img/default.jpg",
        description: document.getElementById('prodDesc').value || ""
    };

    try {
        if (editingIndex >= 0) {
            const id = products[editingIndex].id;
            await db.collection("produtos").doc(id).update(product);
            products[editingIndex] = { id, ...product };
        } else {
            const docRef = await db.collection("produtos").add(product);
            products.push({ id: docRef.id, ...product });
        }

        alert("✅ Produto salvo com sucesso!");
        closeModal();
        renderProducts();
        loadAdminProducts();
    } catch (error) {
        console.error("Erro completo:", error);
        alert("❌ Erro ao salvar:\n" + error.message);
    }
}

async function deleteProduct(index) {
    if (!confirm("Excluir este produto?")) return;
    try {
        await db.collection("produtos").doc(products[index].id).delete();
        products.splice(index, 1);
        renderProducts();
        loadAdminProducts();
    } catch (e) {
        alert("Erro ao excluir");
    }
}

// Funções originais mantidas
function showPage(pageId) {
    document.querySelectorAll('.hero, .main-page').forEach(el => el.classList.remove('active'));
    if (pageId === 'inicio') document.getElementById('inicio').classList.add('active');
    else document.getElementById(pageId).classList.add('active');
}

function createProductCard(product) {
    const card = document.createElement('div');
    card.className = "product-card bg-white rounded-3xl overflow-hidden border";
    card.innerHTML = `
        <div class="h-52 md:h-72 relative">
            <img src="${product.image}" class="w-full h-full object-cover">
            <div class="absolute top-3 right-3 bg-white px-3 py-1 rounded-full font-bold shadow">${product.price}</div>
        </div>
        <div class="p-5">
            <h3 class="font-semibold">${product.name}</h3>
            <p class="text-zinc-500 text-sm">${product.description}</p>
            <button onclick="contactWhatsApp('${product.name}')" class="mt-5 w-full bg-rose-600 hover:bg-rose-700 text-white py-4 rounded-2xl font-medium">
                <i class="fab fa-whatsapp"></i> Quero este!
            </button>
        </div>
    `;
    return card;
}

function renderProducts(list = products) {
    const container = document.getElementById('products-grid');
    container.innerHTML = '';
    list.forEach(p => container.appendChild(createProductCard(p)));
}

function filterCategory(cat) {
    document.querySelectorAll('#loja button').forEach(btn => btn.classList.remove('active-filter'));
    document.getElementById('btn-' + cat).classList.add('active-filter');
    const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
    renderProducts(filtered);
}

function contactWhatsApp(name) {
    const msg = encodeURIComponent(`Olá! Fiquei interessada no "${name}" da Zamirazzo. Pode me dar mais informações?`);
    window.open(`https://wa.me/5549998109578?text=${msg}`, '_blank');
}

function loginAdmin() {
    const pass = document.getElementById('adminPass').value;
    if (pass === "zamirazzo2025") {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadAdminProducts();
    } else {
        alert("Senha incorreta! Use: zamirazzo2025");
    }
}

function loadAdminProducts() {
    const container = document.getElementById('adminProductsList');
    container.innerHTML = '';
    products.forEach((product, index) => {
        const div = document.createElement('div');
        div.className = "border rounded-3xl p-5 bg-white";
        div.innerHTML = `
            <img src="${product.image}" class="w-full h-48 object-cover rounded-2xl">
            <h3 class="font-semibold mt-3">${product.name}</h3>
            <p class="text-rose-600 font-bold">${product.price}</p>
            <div class="flex gap-3 mt-5">
                <button onclick="editProduct(${index})" class="flex-1 bg-blue-600 text-white py-3 rounded-2xl">Editar</button>
                <button onclick="deleteProduct(${index})" class="flex-1 bg-red-600 text-white py-3 rounded-2xl">Excluir</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function openAddModal() {
    editingIndex = -1;
    document.getElementById('modalTitle').textContent = "Adicionar Novo Produto";
    document.getElementById('prodName').value = '';
    document.getElementById('prodPrice').value = '';
    document.getElementById('prodCategory').value = 'brincos';
    document.getElementById('prodImage').value = '';
    document.getElementById('prodDesc').value = '';
    document.getElementById('productModal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('productModal').classList.add('hidden');
}

function editProduct(index) {
    editingIndex = index;
    const p = products[index];
    document.getElementById('modalTitle').textContent = "Editar Produto";
    document.getElementById('prodName').value = p.name;
    document.getElementById('prodPrice').value = p.price;
    document.getElementById('prodCategory').value = p.category;
    document.getElementById('prodImage').value = p.image;
    document.getElementById('prodDesc').value = p.description || "";
    document.getElementById('productModal').classList.remove('hidden');
}

// Inicialização
window.onload = () => {
    loadProducts();
    showPage('inicio');
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamirazzo | Artesanal com Alma</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<!-- FIREBASE V8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body { font-family: 'Segoe UI', system-ui, sans-serif; }
.hero { background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('img/banner.jpeg') center/cover; height: 100vh; display: none; }
.hero.active { display: flex; }
.main-page { display: none; padding-top: 90px; }
.main-page.active { display: block; }
.product-card { transition: all 0.4s ease; }
.product-card:hover { transform: translateY(-10px); }
</style>
</head>

<body class="bg-[#fdf4f0]">

<header class="bg-white shadow-md sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-5 py-5 flex items-center justify-between">
<h1 class="text-3xl font-bold text-rose-700">Zamirazzo</h1>
<nav class="flex gap-5 md:gap-10 text-base md:text-lg font-medium">
<a href="#" onclick="showPage('inicio')">Início</a>
<a href="#" onclick="showPage('loja')">Loja</a>
<a href="#" onclick="showPage('sobre')">Sobre</a>
<a href="#" onclick="showPage('contato')">Contato</a>
<a href="#" onclick="showPage('admin')" class="text-rose-600 font-bold">Vendedora</a>
</nav>
</div>
</header>

<div id="inicio" class="hero active items-center text-white">
<div class="max-w-7xl mx-auto px-6 text-center">
<h2 class="text-5xl md:text-7xl font-bold mb-6">Artesanal.<br>Único.<br>Seu.</h2>
<p class="text-xl md:text-3xl mb-10">Peças feitas à mão com amor.</p>
<button onclick="showPage('loja')" class="bg-rose-700 text-white px-12 py-5 rounded-full">Ver a Coleção</button>
</div>
</div>

<div id="loja" class="main-page">
<div class="max-w-7xl mx-auto px-5 py-12">
<h2 class="text-4xl font-bold text-center mb-12 text-rose-800">Nossa Coleção</h2>

<div class="flex flex-wrap justify-center gap-3 mb-12">
<button onclick="filterCategory('all')" id="btn-all">Todos</button>
<button onclick="filterCategory('brincos')" id="btn-brincos">Brincos</button>
<button onclick="filterCategory('colares')" id="btn-colares">Colares</button>
<button onclick="filterCategory('pulseiras')" id="btn-pulseiras">Pulseiras</button>
<button onclick="filterCategory('chapeus')" id="btn-chapeus">Chapéus</button>
</div>

<div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
</div>
</div>

<div id="admin" class="main-page bg-white">
<div class="max-w-7xl mx-auto px-6 py-10">
<h2 class="text-3xl font-bold text-center mb-6">Painel</h2>

<div id="loginScreen">
<input type="password" id="adminPass" placeholder="Senha" class="w-full p-4 border">
<button onclick="loginAdmin()" class="w-full bg-rose-700 text-white p-4 mt-4">Entrar</button>
</div>

<div id="adminPanel" class="hidden">
<button onclick="openAddModal()" class="bg-green-600 text-white p-4 w-full">+ Produto</button>
<div id="adminProductsList" class="grid md:grid-cols-2 gap-6 mt-6"></div>
</div>
</div>
</div>

<div id="productModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center">
<div class="bg-white p-6 w-full max-w-lg">
<input id="prodName" placeholder="Nome" class="w-full p-3 border mb-3">
<input id="prodPrice" placeholder="Preço" class="w-full p-3 border mb-3">
<select id="prodCategory" class="w-full p-3 border mb-3">
<option value="brincos">Brincos</option>
<option value="colares">Colares</option>
<option value="pulseiras">Pulseiras</option>
<option value="chapeus">Chapéus</option>
</select>
<input id="prodImage" placeholder="URL da imagem" class="w-full p-3 border mb-3">
<textarea id="prodDesc" placeholder="Descrição" class="w-full p-3 border mb-3"></textarea>

<button onclick="saveProduct()" class="bg-rose-700 text-white p-4 w-full">Salvar</button>
</div>
</div>

<script>
// 🔥 FIREBASE CONFIG
const firebaseConfig = {
apiKey: "AIzaSyAzRUtxjZey4wQGiApQaJ1xU9DxyJrnzqo",
authDomain: "zamirazzo.firebaseapp.com",
projectId: "zamirazzo"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let products = [];
let editingId = null;

// 🔥 LOAD
function loadProducts(){
db.collection("produtos").get().then(snapshot=>{
products = [];
snapshot.forEach(doc=>{
products.push({ id: doc.id, ...doc.data() });
});
renderProducts();
loadAdminProducts();
});
}

// 🔥 SAVE
function saveProduct(){
const product = {
name: prodName.value,
price: prodPrice.value,
category: prodCategory.value,
image: prodImage.value || "https://via.placeholder.com/300",
description: prodDesc.value
};

if(editingId){
db.collection("produtos").doc(editingId).update(product);
}else{
db.collection("produtos").add(product);
}

closeModal();
loadProducts();
}

// 🔥 DELETE
function deleteProduct(id){
db.collection("produtos").doc(id).delete().then(loadProducts);
}

// 🔥 EDIT
function editProduct(id){
const p = products.find(x=>x.id===id);
editingId = id;

prodName.value = p.name;
prodPrice.value = p.price;
prodCategory.value = p.category;
prodImage.value = p.image;
prodDesc.value = p.description;

document.getElementById('productModal').classList.remove('hidden');
}

// 🔥 RENDER
function renderProducts(list = products){
const container = document.getElementById('products-grid');
container.innerHTML = '';

list.forEach(p=>{
container.innerHTML += `
<div class="product-card bg-white rounded-3xl overflow-hidden border">
<img src="${p.image}" onerror="this.src='https://via.placeholder.com/300'">
<h3>${p.name}</h3>
<p>${p.price}</p>
</div>`;
});
}

// 🔥 ADMIN
function loadAdminProducts(){
const c = document.getElementById('adminProductsList');
c.innerHTML = '';

products.forEach(p=>{
c.innerHTML += `
<div class="border p-3">
<img src="${p.image}" class="h-40 w-full object-cover">
<h3>${p.name}</h3>
<button onclick="editProduct('${p.id}')">Editar</button>
<button onclick="deleteProduct('${p.id}')">Excluir</button>
</div>`;
});
}

// 🔥 UI
function openAddModal(){
editingId=null;
document.getElementById('productModal').classList.remove('hidden');
}
function closeModal(){
document.getElementById('productModal').classList.add('hidden');
}
function loginAdmin(){
if(adminPass.value==="zamirazzo2025"){
loginScreen.classList.add('hidden');
adminPanel.classList.remove('hidden');
}
}
function showPage(id){
document.querySelectorAll('.main-page, .hero').forEach(el=>el.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
function filterCategory(cat){
const filtered = cat==="all"?products:products.filter(p=>p.category===cat);
renderProducts(filtered);
}

// 🔥 INIT
window.onload = ()=>{
loadProducts();
};
</script>

</body>
</html>

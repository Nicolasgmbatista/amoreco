<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamirazzo | Artesanal com Alma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .hero { background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('img/banner.jpeg') center/cover; height: 100vh; display: none; }
        .hero.active { display: flex; }
        .main-page { display: none; padding-top: 80px; }
        .main-page.active { display: block; }
        .product-card { transition: all 0.4s ease; }
        .product-card:hover { transform: translateY(-8px); }
    </style>
</head>
<body class="bg-[#fdf4f0]">

    <!-- HEADER -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-5 py-5 flex items-center justify-between">
            <h1 class="text-3xl font-bold text-rose-700">Zamirazzo</h1>
            <nav class="flex gap-5 md:gap-8 text-base md:text-lg font-medium">
                <a href="#" onclick="showPage('inicio')" class="hover:text-rose-600">Início</a>
                <a href="#" onclick="showPage('loja')" class="hover:text-rose-600">Loja</a>
                <a href="#" onclick="showPage('sobre')" class="hover:text-rose-600">Sobre</a>
                <a href="#" onclick="showPage('contato')" class="hover:text-rose-600">Contato</a>
                <a href="#" onclick="showPage('admin')" class="text-rose-600 font-bold">👩‍💼 Vendedora</a>
            </nav>
        </div>
    </header>

    <!-- BANNER -->
    <div id="inicio" class="hero active items-center text-white">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h2 class="text-5xl md:text-7xl font-bold mb-6">Artesanal.<br>Único.<br>Seu.</h2>
            <p class="text-xl md:text-3xl mb-10">Brincos, colares, pulseiras e chapéus feitos à mão com miçangas.</p>
            <button onclick="showPage('loja')" class="bg-rose-700 hover:bg-rose-800 text-white text-xl px-12 py-5 rounded-full">Ver a Coleção</button>
        </div>
    </div>

    <!-- LOJA, SOBRE, CONTATO... (mantidos iguais) -->
    <!-- ... (o resto do código continua igual) ... -->

    <!-- ====================== ÁREA DA VENDEDORA ====================== -->
    <div id="admin" class="main-page bg-white min-h-screen">
        <div class="max-w-7xl mx-auto px-6 py-10">
            <h2 class="text-4xl font-bold text-center mb-8">👩‍💼 Painel da Vendedora</h2>
            
            <div class="mb-8">
                <input type="password" id="adminPass" placeholder="Digite a senha" 
                       class="border p-3 rounded-lg w-full md:w-80">
                <button onclick="loginAdmin()" 
                        class="ml-2 bg-rose-700 text-white px-6 py-3 rounded-lg">Entrar</button>
            </div>

            <div id="adminPanel" class="hidden">
                <button onclick="addNewProduct()" 
                        class="bg-green-600 text-white px-6 py-3 rounded-lg mb-6">
                    + Adicionar Novo Produto
                </button>

                <div id="adminProducts" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </div>
    </div>

    <script>
        let allProducts = JSON.parse(localStorage.getItem('zamirazzoProducts')) || [
            { id: 1, name: "Brinco Miçanga Colorful", category: "brincos", price: "R$ 45,00", image: "img/brinco1.jpg", description: "Brincos leves e vibrantes" }
        ];

        function showPage(pageId) {
            document.querySelectorAll('.hero, .main-page').forEach(el => el.classList.remove('active'));
            if (pageId === 'inicio') {
                document.getElementById('inicio').classList.add('active');
            } else {
                document.getElementById(pageId).classList.add('active');
            }
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === "123456" || pass === "zamirazzo") {   // ← Mude a senha depois
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert("Senha incorreta!");
            }
        }

        function renderAdminProducts() {
            const container = document.getElementById('adminProducts');
            container.innerHTML = '';
            allProducts.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = "border rounded-2xl p-4 bg-white";
                div.innerHTML = `
                    <img src="${p.image}" class="w-full h-48 object-cover rounded-xl">
                    <h3 class="font-semibold mt-3">${p.name}</h3>
                    <p class="text-sm text-zinc-500">${p.price}</p>
                    <div class="flex gap-2 mt-4">
                        <button onclick="editProduct(${index})" class="flex-1 bg-blue-600 text-white py-2 rounded-lg">Editar</button>
                        <button onclick="deleteProduct(${index})" class="flex-1 bg-red-600 text-white py-2 rounded-lg">Excluir</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addNewProduct() {
            const name = prompt("Nome do produto:");
            if (!name) return;
            const price = prompt("Preço (ex: R$ 45,00):");
            const category = prompt("Categoria (brincos, colares, pulseiras, chapeus):");
            const desc = prompt("Descrição curta:");

            allProducts.push({
                id: Date.now(),
                name: name,
                price: price,
                category: category || "brincos",
                image: "img/brinco1.jpg", // depois ela pode trocar
                description: desc || ""
            });

            localStorage.setItem('zamirazzoProducts', JSON.stringify(allProducts));
            renderAdminProducts();
            alert("Produto adicionado!");
        }

        function deleteProduct(index) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                allProducts.splice(index, 1);
                localStorage.setItem('zamirazzoProducts', JSON.stringify(allProducts));
                renderAdminProducts();
            }
        }

        function editProduct(index) {
            const p = allProducts[index];
            const newName = prompt("Novo nome:", p.name);
            if (newName) p.name = newName;
            const newPrice = prompt("Novo preço:", p.price);
            if (newPrice) p.price = newPrice;
            
            localStorage.setItem('zamirazzoProducts', JSON.stringify(allProducts));
            renderAdminProducts();
        }

        function contactWhatsApp(name) {
            const msg = encodeURIComponent(`Olá! Fiquei interessada no "${name}". Pode me dar mais informações?`);
            window.open(`https://wa.me/5549998109578?text=${msg}`, '_blank');
        }

        window.onload = () => {
            renderAdminProducts();
            showPage('inicio');
        };
    </script>
</body>
</html>

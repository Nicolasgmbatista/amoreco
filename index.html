<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamirazzo | Artesanal com Alma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#fdf4f0]">

    <!-- HEADER -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-5 py-5 flex items-center justify-between">
            <h1 class="text-3xl font-bold text-rose-700">Zamirazzo</h1>
            <nav class="flex gap-5 md:gap-8 text-base md:text-lg font-medium">
                <a href="#" onclick="showPage('inicio')" class="hover:text-rose-600">Início</a>
                <a href="#" onclick="showPage('loja')" class="hover:text-rose-600">Loja</a>
                <a href="#" onclick="showPage('sobre')" class="hover:text-rose-600">Sobre</a>
                <a href="#" onclick="showPage('contato')" class="hover:text-rose-600">Contato</a>
                <a href="#" onclick="showPage('admin')" class="text-rose-600 font-bold">👩‍💼 Vendedora</a>
            </nav>
        </div>
    </header>

    <!-- BANNER INICIAL -->
    <div id="inicio" class="hero active items-center text-white" style="background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('img/banner.jpeg') center/cover; height: 100vh;">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h2 class="text-5xl md:text-7xl font-bold mb-6">Artesanal.<br>Único.<br>Seu.</h2>
            <p class="text-xl md:text-3xl mb-10">Brincos, colares, pulseiras e chapéus feitos à mão com miçangas e muito amor.</p>
            <button onclick="showPage('loja')" class="bg-rose-700 hover:bg-rose-800 text-white text-xl px-12 py-5 rounded-full">Ver a Coleção</button>
        </div>
    </div>

    <!-- LOJA, SOBRE, CONTATO (resumido) -->
    <div id="loja" class="main-page"> ... </div>
    <div id="sobre" class="main-page"> ... </div>
    <div id="contato" class="main-page"> ... </div>

    <!-- ====================== PAINEL DA VENDEDORA ====================== -->
    <div id="admin" class="main-page bg-white min-h-screen">
        <div class="max-w-7xl mx-auto px-6 py-10">
            <h2 class="text-4xl font-bold text-center mb-8">👩‍💼 Painel da Vendedora</h2>
            
            <div id="loginScreen">
                <input type="password" id="adminPass" placeholder="Senha da Vendedora" 
                       class="border-2 border-rose-300 p-4 rounded-2xl w-full max-w-md mx-auto block text-center text-lg">
                <button onclick="loginAdmin()" 
                        class="mt-6 bg-rose-700 hover:bg-rose-800 text-white px-10 py-4 rounded-2xl w-full max-w-md mx-auto block text-lg font-medium">
                    Entrar no Painel
                </button>
            </div>

            <div id="adminPanel" class="hidden">
                <button onclick="addProduct()" 
                        class="bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-2xl mb-8 text-lg font-medium">
                    + Adicionar Novo Produto
                </button>
                
                <div id="adminProductsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== SEU FIREBASE CONFIG ====================
        const firebaseConfig = {
          apiKey: "AIzaSyAzRUtxjZey4wQGiApQaJ1xU9DxyJrnzqo",
          authDomain: "zamirazzo.firebaseapp.com",
          projectId: "zamirazzo",
          storageBucket: "zamirazzo.firebasestorage.app",
          messagingSenderId: "143536414159",
          appId: "1:143536414159:web:373eed517d649ecd85c6ba"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== FUNÇÕES ====================
        function showPage(pageId) {
            document.querySelectorAll('.hero, .main-page').forEach(el => el.classList.remove('active'));
            if (pageId === 'inicio') {
                document.getElementById('inicio').classList.add('active');
            } else {
                document.getElementById(pageId).classList.add('active');
            }
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === "zamirazzo2025") {   // ← MUDE ESTA SENHA DEPOIS!
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadProducts();
            } else {
                alert("Senha incorreta!");
            }
        }

        async function loadProducts() {
            const snapshot = await db.collection("products").get();
            const container = document.getElementById('adminProductsList');
            container.innerHTML = "";

            snapshot.forEach(doc => {
                const p = doc.data();
                const div = document.createElement('div');
                div.className = "border rounded-3xl overflow-hidden bg-white";
                div.innerHTML = `
                    <img src="${p.image || 'https://via.placeholder.com/300'}" class="w-full h-48 object-cover">
                    <div class="p-5">
                        <h3 class="font-semibold">${p.name}</h3>
                        <p class="text-rose-600 font-bold">${p.price}</p>
                        <button onclick="deleteProduct('${doc.id}')" 
                                class="mt-4 w-full bg-red-600 text-white py-3 rounded-2xl text-sm">
                            Excluir Produto
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function addProduct() {
            const name = prompt("Nome do produto:");
            if (!name) return;
            
            const price = prompt("Preço (ex: R$ 45,00):");
            const category = prompt("Categoria (brincos, colares, pulseiras, chapeus):", "brincos");
            const image = prompt("URL da imagem:", "img/brinco1.jpg");
            const description = prompt("Descrição curta:", "");

            await db.collection("products").add({
                name: name,
                price: price,
                category: category,
                image: image,
                description: description,
                createdAt: new Date()
            });

            alert("✅ Produto adicionado com sucesso!");
            loadProducts();
        }

        async function deleteProduct(id) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                await db.collection("products").doc(id).delete();
                alert("Produto excluído!");
                loadProducts();
            }
        }

        // Inicialização
        window.onload = () => {
            showPage('inicio');
        };
    </script>
</body>
</html>

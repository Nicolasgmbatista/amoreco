<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamirazzo</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase versão compatível -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>

<body class="bg-gray-100">

<div class="p-5">
  <h1 class="text-2xl font-bold text-center mb-5">Zamirazzo Loja</h1>

  <div id="products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

  <button onclick="openModal()" class="mt-6 bg-green-600 text-white px-4 py-2 rounded w-full">
    + Adicionar Produto
  </button>

  <div id="adminList" class="mt-6 grid grid-cols-2 gap-4"></div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center">
  <div class="bg-white p-5 rounded w-full max-w-md">
    <input id="name" placeholder="Nome" class="w-full mb-2 p-2 border">
    <input id="price" placeholder="Preço" class="w-full mb-2 p-2 border">
    <input id="image" placeholder="URL imagem" class="w-full mb-2 p-2 border">
    <textarea id="desc" placeholder="Descrição" class="w-full mb-2 p-2 border"></textarea>

    <div class="flex gap-2">
      <button onclick="closeModal()" class="flex-1 border p-2">Cancelar</button>
      <button onclick="save()" class="flex-1 bg-red-500 text-white p-2">Salvar</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzRUtxjZey4wQGiApQaJ1xU9DxyJrnzqo",
  authDomain: "zamirazzo.firebaseapp.com",
  projectId: "zamirazzo",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let editId = null;
let products = [];

// ===== LOAD =====
function load() {
  db.collection("produtos").get().then(snap => {
    products = [];
    snap.forEach(doc => {
      products.push({ id: doc.id, ...doc.data() });
    });
    render();
    renderAdmin();
  });
}

// ===== SAVE =====
function save() {
  const product = {
    name: name.value,
    price: price.value,
    image: image.value || "https://via.placeholder.com/300",
    desc: desc.value
  };

  if (!product.name) return alert("Nome obrigatório");

  if (editId) {
    db.collection("produtos").doc(editId).update(product);
  } else {
    db.collection("produtos").add(product);
  }

  editId = null;
  closeModal();
  setTimeout(load, 500);
}

// ===== DELETE =====
function del(id) {
  if (confirm("Excluir?")) {
    db.collection("produtos").doc(id).delete().then(load);
  }
}

// ===== EDIT =====
function edit(id) {
  const p = products.find(x => x.id === id);
  editId = id;

  name.value = p.name;
  price.value = p.price;
  image.value = p.image;
  desc.value = p.desc;

  openModal();
}

// ===== RENDER =====
function render() {
  productsGrid.innerHTML = products.map(p => `
    <div class="bg-white rounded shadow">
      <img src="${p.image}" class="w-full h-40 object-cover">
      <div class="p-2">
        <h3 class="font-bold">${p.name}</h3>
        <p>${p.desc || ""}</p>
        <p class="text-red-500 font-bold">${p.price || ""}</p>
      </div>
    </div>
  `).join("");
}

function renderAdmin() {
  adminList.innerHTML = products.map(p => `
    <div class="border p-2 rounded">
      <img src="${p.image}" class="h-24 w-full object-cover">
      <h3>${p.name}</h3>
      <div class="flex gap-2 mt-2">
        <button onclick="edit('${p.id}')" class="bg-blue-500 text-white px-2">Editar</button>
        <button onclick="del('${p.id}')" class="bg-red-500 text-white px-2">Excluir</button>
      </div>
    </div>
  `).join("");
}

// ===== UI =====
function openModal() {
  modal.classList.remove("hidden");
}

function closeModal() {
  modal.classList.add("hidden");
}

// INIT
window.onload = load;
</script>

</body>
</html>
